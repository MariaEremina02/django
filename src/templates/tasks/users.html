{% extends 'tasks/base.html' %}
{% load static %}
{% block content %}
<h2>Пользователи</h2>

<div class="row">
    {% for user in users %}
    <div class="col-md-3">
        <div class="card mb-3">
            <img src="{% static user.image %}" alt="{{ user.name }}" class="card-img-top">
            <div class="card-body">
                <h5>{{ user.name }}</h5>
                <p>Возраст: {{ user.age }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
